<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>AI Simulation</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle at center, #050505, #000);
    color: #00d4ff;
    font-family: "Courier New", monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
}

.container {
    max-width: 700px;
    padding: 20px;
}

.text {
    font-size: 20px;
    margin: 8px 0;
    opacity: 0;
    transition: opacity 0.8s ease;
}

.visible {
    opacity: 1;
}

.highlight {
    color: #ff4fd8;
}

.final {
    font-size: 34px;
    margin-top: 30px;
    color: #ff4fd8;
    font-weight: bold;
    animation: glow 1.5s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #ff4fd8; }
    to { text-shadow: 0 0 25px #ff4fd8; }
}

.cursor::after {
    content: "|";
    animation: blink 1s infinite;
}

@keyframes blink {
    0%, 50%, 100% { opacity: 1; }
    25%, 75% { opacity: 0; }
}

button {
    margin-top: 20px;
    padding: 10px 20px;
    background: #111;
    color: #00d4ff;
    border: 1px solid #00d4ff;
    cursor: pointer;
}
</style>

</head>
<body>

<div class="container">
    <div class="text visible">Sistema listo. Iniciar simulación.</div>
    <button onclick="runSimulation()">Iniciar</button>
    <div id="output"></div>
</div>

<script>

const steps = [
"Inicializando sistema...",
"Cargando módulos emocionales...",
"Sincronizando datos...",
"Analizando variables: Ale Alvarado...",
"Escaneando interacciones...",
"Procesando patrones...",
"Calculando compatibilidad...",
"Compatibilidad detectada: 99.8%",
"Validando resultado...",
"Ejecutando simulación final...",
"Detectando resultado óptimo...",
"Resultado irreversible detectado...",
"Iniciando protocolo especial..."
];

const finalMessage = "Ale, ¿quieres ser mi novia?";

const output = document.getElementById("output");

function vibrate(pattern) {
    if (navigator.vibrate) {
        navigator.vibrate(pattern);
    }
}

function typeLine(text, speed = 40) {
    return new Promise(resolve => {
        const div = document.createElement("div");
        div.className = "text visible cursor";
        output.appendChild(div);

        let i = 0;
        const interval = setInterval(() => {
            div.textContent = text.substring(0, i);
            i++;

            if (i > text.length) {
                clearInterval(interval);
                div.classList.remove("cursor");
                resolve();
            }
        }, speed);
    });
}

async function runSimulation() {
    document.querySelector("button").style.display = "none";

    for (let i = 0; i < steps.length; i++) {
        await typeLine(steps[i], 45);

        // Vibración sutil en pasos clave
        if (i === 3 || i === 7) {
            vibrate(100);
        }

        await new Promise(r => setTimeout(r, 800));
    }

    // Vibración más fuerte antes del final
    vibrate([200, 100, 200]);

    const final = document.createElement("div");
    final.className = "final";
    final.innerHTML = `<span class="highlight">${finalMessage}</span>`;
    output.appendChild(final);

    // Vibración final (impacto)
    setTimeout(() => {
        vibrate([300, 100, 300]);
    }, 300);
}

</script>

</body>
</html>
