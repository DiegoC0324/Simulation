<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>AI Simulation</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle at center, #050505, #000);
    color: #00d4ff;
    font-family: "Courier New", monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
}

.container {
    max-width: 700px;
}

.text {
    font-size: 20px;
    opacity: 0;
    margin: 10px 0;
    transition: opacity 1s ease;
}

.visible {
    opacity: 1;
}

.highlight {
    color: #ff4fd8;
}

.final {
    font-size: 32px;
    margin-top: 30px;
    color: #ff4fd8;
    font-weight: bold;
    letter-spacing: 1px;
}

/* Cursor tipo terminal */
.cursor::after {
    content: "|";
    animation: blink 1s infinite;
}

@keyframes blink {
    0%, 50%, 100% { opacity: 1; }
    25%, 75% { opacity: 0; }
}
</style>

</head>
<body>

<div class="container" id="container"></div>

<script>

const steps = [
"Inicializando sistema...",
"Cargando módulos emocionales...",
"Sincronizando datos...",
"Analizando variables: Ale Alvarado...",
"Escaneando interacciones...",
"Procesando patrones de comportamiento...",
"Calculando compatibilidad...",
"Compatibilidad detectada: 99.8%",
"Validando resultado...",
"Ejecutando simulación final...",
"Detectando resultado óptimo...",
"Iniciando protocolo especial..."
];

const finalMessage = "Ale, ¿quieres ser mi novia?";

const container = document.getElementById("container");

function typeText(text, delay) {
    return new Promise(resolve => {
        const div = document.createElement("div");
        div.classList.add("text", "cursor");
        container.appendChild(div);

        let i = 0;

        const interval = setInterval(() => {
            div.textContent = text.substring(0, i);
            i++;

            if (i > text.length) {
                clearInterval(interval);
                div.classList.remove("cursor");
                resolve();
            }
        }, delay);
    });
}

async function runSimulation() {
    for (let step of steps) {
        await typeText(step, 40); // velocidad typing
        await new Promise(r => setTimeout(r, 900)); // pausa entre pasos
    }

    const final = document.createElement("div");
    final.classList.add("final");
    final.innerHTML = `<span class="highlight">${finalMessage}</span>`;
    container.appendChild(final);
}

runSimulation();

</script>

</body>
</html>
