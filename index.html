<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>AI Simulation</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle at center, #050505, #000);
    color: #00d4ff;
    font-family: "Courier New", monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
    overflow: hidden;
}

.container {
    max-width: 700px;
    padding: 20px;
    position: relative;
}

/* HUD */
.hud::before, .hud::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 1px;
    background: linear-gradient(to right, transparent, #00d4ff, transparent);
    animation: scan 3s infinite;
}
.hud::before { top: 20%; }
.hud::after { bottom: 20%; }

@keyframes scan {
    0% { opacity: 0.2; }
    50% { opacity: 1; }
    100% { opacity: 0.2; }
}

.text {
    font-size: 20px;
    margin: 8px 0;
    opacity: 0;
    transition: opacity 0.6s ease;
}

.visible { opacity: 1; }

.highlight { color: #ff4fd8; }

.final {
    font-size: 34px;
    margin-top: 30px;
    color: #ff4fd8;
    font-weight: bold;
    animation: glow 1.5s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #ff4fd8; }
    to { text-shadow: 0 0 30px #ff4fd8; }
}

.cursor::after {
    content: "|";
    animation: blink 1s infinite;
}
@keyframes blink {
    50% { opacity: 0; }
}

/* Botones */
button {
    margin: 12px;
    padding: 12px 22px;
    font-size: 16px;
    cursor: pointer;
}

.yes {
    background: #ff4fd8;
    color: white;
    border: none;
}

.no {
    background: #111;
    color: #00d4ff;
    border: 1px solid #00d4ff;
}

/* Flash */
.flash {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:#ff4fd8;
    opacity:0;
    pointer-events:none;
}
</style>
</head>

<body>

<div class="container hud">
    <div class="text visible">Sistema listo.</div>
    <button onclick="start()">Iniciar simulación</button>
    <div id="output"></div>
</div>

<div id="flash" class="flash"></div>

<script>

const steps = [
"Inicializando sistema...",
"Cargando módulos emocionales...",
"Sincronizando datos...",
"Analizando variables: Ale Alvarado...",
"Escaneando interacciones...",
"Procesando patrones...",
"Calculando compatibilidad...",
"Compatibilidad detectada: 99.8%",
"Validando resultado...",
"Ejecutando simulación final...",
"Resultado irreversible detectado...",
"Iniciando protocolo especial..."
];

const finalMessage = "Ale, ¿quieres ser mi novia?";

const output = document.getElementById("output");
let audioCtx;

function vibrate(p){
    if(navigator.vibrate) navigator.vibrate(p);
}

function beep(freq=500, dur=0.08){
    try{
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.value = 0.03;
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
    }catch(e){}
}

function typeLine(text, speed=35){
    return new Promise(resolve=>{
        const div = document.createElement("div");
        div.className="text visible cursor";
        output.appendChild(div);

        let i=0;
        const interval=setInterval(()=>{
            div.textContent=text.substring(0,i);
            i++;

            if(i>text.length){
                clearInterval(interval);
                div.classList.remove("cursor");
                resolve();
            }
        },speed);
    });
}

async function start(){
    document.querySelector("button").style.display="none";

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    for(let i=0;i<steps.length;i++){
        await typeLine(steps[i], 40);
        beep(300 + i*20);

        if(i===3 || i===7) vibrate(80);

        await new Promise(r=>setTimeout(r,700));
    }

    vibrate([200,100,200]);

    const final = document.createElement("div");
    final.className="final";
    final.innerHTML=`<span class="highlight">${finalMessage}</span>`;
    output.appendChild(final);

    // FLASH
    const flash=document.getElementById("flash");
    flash.style.opacity="0.8";
    setTimeout(()=> flash.style.opacity="0", 200);

    beep(900,0.2);

    // BOTONES
    const yesBtn = document.createElement("button");
    yesBtn.className="yes";
    yesBtn.textContent="Sí";

    const noBtn = document.createElement("button");
    noBtn.className="no";
    noBtn.textContent="Seguir analizando...";

    output.appendChild(yesBtn);
    output.appendChild(noBtn);

    // RESPUESTAS
    yesBtn.onclick = () => {
        vibrate([300,100,300]);
        beep(1200,0.3);

        const msg = document.createElement("div");
        msg.className="final";
        msg.innerHTML="Resultado confirmado 💖";
        output.appendChild(msg);
    };

    noBtn.onclick = async () => {
        vibrate(100);
        noBtn.remove();

        await typeLine("Recalculando...");
        await typeLine("No se encontraron mejores opciones...");
        await typeLine("Resultado final: Ale sigue siendo la mejor elección 😌");

        beep(700,0.2);
    };
}

</script>

</body>
</html>
