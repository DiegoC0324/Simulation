<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulation</title>

<style>
    body {
        margin: 0;
        background: radial-gradient(circle at center, #0a0a0a, #000);
        color: #fff;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
    }

    .container {
        max-width: 600px;
    }

    .text {
        font-size: 22px;
        opacity: 0;
        transition: opacity 1s ease;
    }

    .visible {
        opacity: 1;
    }

    .highlight {
        color: #00d4ff;
    }

    .final {
        font-size: 30px;
        margin-top: 20px;
        color: #ff4fd8;
        font-weight: bold;
    }
</style>

</head>
<body>

<div class="container">
    <div id="step1" class="text">Inicializando sistema...</div>
    <div id="step2" class="text">Analizando variables: <span class="highlight">Ale Alvarado</span>...</div>
    <div id="step3" class="text">Procesando datos emocionales...</div>
    <div id="step4" class="text">Analizando compatibilidad...</div>
    <div id="step5" class="text">Compatibilidad detectada: <span class="highlight">99.8%</span></div>
    <div id="step6" class="text">Resultado óptimo encontrado...</div>
    <div id="step7" class="text">Inicializando propuesta...</div>
    <div id="final" class="text final">Ale, ¿quieres ser mi novia?</div>
</div>

<script>
    const steps = ["step1", "step2", "step3", "step4", "step5", "step6", "step7", "final"];
    
    steps.forEach((id, index) => {
        setTimeout(() => {
            document.getElementById(id).classList.add("visible");
        }, index * 1400);
    });
</script>

</body>
</html>
