<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>AI Simulation</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle at center, #050505, #000);
    color: #00d4ff;
    font-family: "Courier New", monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
    overflow: hidden;
}

.container {
    max-width: 700px;
    padding: 20px;
}

.text {
    font-size: 20px;
    margin: 8px 0;
    opacity: 0;
    transition: opacity 0.6s ease;
}

.visible { opacity: 1; }

.highlight { color: #ff4fd8; }

.final {
    font-size: 34px;
    margin-top: 30px;
    color: #ff4fd8;
    font-weight: bold;
}

button {
    margin: 10px;
    padding: 12px 20px;
    font-size: 16px;
    border: none;
    cursor: pointer;
}

.yes {
    background: #ff4fd8;
    color: white;
}

.no {
    background: #111;
    color: #00d4ff;
    border: 1px solid #00d4ff;
}
</style>
</head>

<body>

<div class="container">
    <div class="text visible">Sistema listo.</div>
    <button onclick="start()">Iniciar simulación</button>
    <div id="output"></div>
</div>

<script>

const steps = [
"Inicializando sistema...",
"Analizando variables: Ale Alvarado...",
"Calculando compatibilidad...",
"Compatibilidad detectada: 99.8%",
"Resultado irreversible detectado..."
];

const finalMessage = "Ale, ¿quieres ser mi novia?";

const output = document.getElementById("output");

function typeLine(text, speed=35){
    return new Promise(resolve=>{
        const div = document.createElement("div");
        div.className="text visible";
        output.appendChild(div);

        let i=0;
        const interval=setInterval(()=>{
            div.textContent=text.substring(0,i);
            i++;

            if(i>text.length){
                clearInterval(interval);
                resolve();
            }
        },speed);
    });
}

async function start(){
    document.querySelector("button").style.display="none";

    for(let step of steps){
        await typeLine(step);
        await new Promise(r=>setTimeout(r,700));
    }

    const final = document.createElement("div");
    final.className="final";
    final.innerHTML=finalMessage;
    output.appendChild(final);

    // BOTONES
    const yesBtn = document.createElement("button");
    yesBtn.className="yes";
    yesBtn.textContent="Sí";

    const noBtn = document.createElement("button");
    noBtn.className="no";
    noBtn.textContent="Seguir analizando...";

    output.appendChild(yesBtn);
    output.appendChild(noBtn);

    // ACCIONES
    yesBtn.onclick = () => {
        output.innerHTML += "<div class='final'>Resultado confirmado 💖</div>";
    };

    noBtn.onclick = async () => {
        noBtn.remove();

        await typeLine("Recalculando...");
        await typeLine("No se encontraron mejores opciones...");
        await typeLine("Resultado final: Ale sigue siendo la mejor elección 😌");
    };
}

</script>

</body>
</html>
